# 文档站 nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 同时托管两个 VitePress 站点，靠子路径区分：
#   /docs/      → docs/      （对客操作手册）
#   /dev-docs/  → dev-docs/  （开发者文档）
#
# 两站在构建时都用 DOCS_BASE 把 base 设成了对应子路径，所以产物内部的资源引用
# 已经是 /docs/… 与 /dev-docs/…。这里只要把产物放到与 URL 同名的目录
# （Dockerfile 里 COPY 到 /usr/share/nginx/html/{docs,dev-docs}），
# 用 root + try_files 就能正确服务，**不需要 alias**。

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  image/svg+xml;

  # 根路径给个入口，默认进对客手册（门店人员是主要读者）
  location = / {
    return 302 /docs/;
  }

  # ── 对客操作手册 ────────────────────────────────────────────────────
  location /docs/ {
    # ⚠️ `$uri.html` 这一档**必须**有：两站都开了 `cleanUrls: true`，
    #    生成的是 foo.html 而不是 foo/index.html，站内链接也不带 .html。
    #    少了它，二级页面（如 /docs/member/customers）会 404。
    #    这里用 =404 而非回落到首页 —— 静态站每个路由都有对应的 .html，
    #    不像 SPA 需要 fallback，乱返回 200 反而会掩盖死链。
    try_files $uri $uri/ $uri.html =404;
  }

  # ── 开发者文档 ──────────────────────────────────────────────────────
  location /dev-docs/ {
    try_files $uri $uri/ $uri.html =404;
  }

  # ── 带内容哈希的静态资源长缓存 ──────────────────────────────────────
  # 正则 location 优先级高于前缀 location，所以 /docs/assets/… 会先命中这里。
  # Vite 产物文件名带哈希，可以放心 immutable。
  location ~* ^/(docs|dev-docs)/assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # VitePress 自带 404 页（产物根有 404.html）
  error_page 404 /docs/404.html;
}
