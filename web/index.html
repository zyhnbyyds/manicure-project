<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      品牌 LOGO：透明底 PNG（源图 256px；线稿在小尺寸下锐化过）。
      上一版「甲油瓶徽章」的 favicon.svg / image/logo.svg 已被新品牌取代并删除。
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>美甲管理系统</title>
    <script>
      // 旧版本 localStorage 前缀迁移：nest-admin:* → manicure:*（一次性，早于所有模块执行）
      (function () {
        var legacy = 'nest-admin:';
        var prefix = 'manicure:';
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var key = localStorage.key(i);
          if (!key || key.indexOf(legacy) !== 0) continue;
          var next = prefix + key.slice(legacy.length);
          if (localStorage.getItem(next) === null) {
            localStorage.setItem(next, localStorage.getItem(key));
          }
          localStorage.removeItem(key);
        }
      })();
      // 首屏防闪烁：在应用挂载前同步应用暗色模式
      (function () {
        var mode = localStorage.getItem('manicure:color-mode') || 'auto';
        var dark;
        if (mode === 'dark') dark = true;
        else if (mode === 'light') dark = false;
        else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('lew-dark');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
