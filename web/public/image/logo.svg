<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7FB0"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6FA5"/>
      <stop offset="100%" stop-color="#C44BE0"/>
    </linearGradient>
    <clipPath id="badge">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
    <clipPath id="bottle">
      <rect x="156" y="220" width="200" height="228" rx="34"/>
    </clipPath>
  </defs>

  <!-- 圆形徽章底 -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <g clip-path="url(#badge)">
    <!-- 瓶盖 -->
    <rect x="196" y="82" width="120" height="112" rx="24" fill="#ffffff"/>
    <!-- 瓶颈 -->
    <rect x="232" y="186" width="48" height="44" fill="#ffffff"/>
    <!-- 瓶身 -->
    <rect x="156" y="220" width="200" height="228" rx="34" fill="#ffffff"/>
    <!-- 甲油液体 -->
    <g clip-path="url(#bottle)">
      <rect x="156" y="330" width="200" height="118" fill="url(#liquid)" opacity="0.75"/>
    </g>
    <!-- 闪粉点缀 -->
    <path
      d="M400 106 Q400 132 426 132 Q400 132 400 158 Q400 132 374 132 Q400 132 400 106 Z"
      fill="#ffffff"
      opacity="0.9"
    />
    <path
      d="M122 356 Q122 374 140 374 Q122 374 122 392 Q122 374 104 374 Q122 374 122 356 Z"
      fill="#ffffff"
      opacity="0.75"
    />
  </g>
</svg>
