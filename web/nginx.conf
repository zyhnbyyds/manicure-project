# 后台前端 nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 只干两件事：托管 SPA + 把 /api/ 反代给 api 容器。
# 上游用服务名 `api`（compose 网络内的 DNS），不需要知道端口映射。

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 后端 multipart 限制是 5MB（src/main.ts），这里留一点余量，
  # 否则超限请求会被 nginx 直接拒掉，前端拿到的是 413 而不是后端的错误结构。
  client_max_body_size 6m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml;

  # ── API 反向代理 ────────────────────────────────────────────────
  # proxy_pass 不带路径：保留原始 URI，因此 /api/v1/xxx 原样交给后端
  # （后端 globalPrefix = api/v1，见 src/main.ts）。
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 后端 Fastify 开了 trustProxy，靠这个头拿真实客户端 IP（登录日志 / 操作日志要用）
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 报表导出、批量生成等慢接口留足时间
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # 上传是 multipart，不要缓冲整包
    proxy_request_buffering off;
  }

  # ── 静态资源 ────────────────────────────────────────────────────
  # Vite 产物带内容哈希，可以放心长缓存
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html 绝不能长缓存：否则前端发版后用户一直拿到旧的入口文件
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # ── SPA 路由回退 ────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
